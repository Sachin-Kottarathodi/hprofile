name: Deploy Hugo Site

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.102.3"
          extended: true

      - name: Build production site
        if: github.ref == 'refs/heads/main'
        run: hugo --minify

      - name: Build preview site
        if: github.ref == 'refs/heads/dev'
        run: hugo --minify --baseURL "https://sachin-kottarathodi.github.io/hprofile-dev/"

      - name: Publish preview to hprofile-dev
        if: github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          external_repository: Sachin-Kottarathodi/hprofile-dev
          publish_branch: gh-pages
          publish_dir: ./public

      - name: Upload production artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4